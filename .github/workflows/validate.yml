name: Validate skills

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate skill metadata
        run: python scripts/validate_skills.py
      - name: Compile helper scripts
        run: |
          python -m py_compile ai-paper-review/scripts/audit_tex_submission.py
          python -m py_compile paper-data-auditor/scripts/audit_numbers.py
